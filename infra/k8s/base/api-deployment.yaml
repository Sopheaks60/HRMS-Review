apiVersion: apps/v1
kind: Deployment
metadata:
  name: krompay-api
  namespace: krompay
spec:
  replicas: 2
  selector:
    matchLabels: { app: krompay-api }
  template:
    metadata:
      labels: { app: krompay-api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: ghcr.io/krompay/api:1.0.0
          ports: [{ containerPort: 4000 }]
          envFrom: [{ secretRef: { name: krompay-secrets } }]
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: 4000 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health/live, port: 4000 }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: krompay-api
  namespace: krompay
spec:
  selector: { app: krompay-api }
  ports: [{ port: 80, targetPort: 4000 }]
