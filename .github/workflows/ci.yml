name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @krompay/shared test
      - run: pnpm --filter @krompay/shared build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
      - run: flutter test
        working-directory: apps/mobile
      - run: docker build -f infra/docker/Dockerfile.api .
      - run: docker build -f infra/docker/Dockerfile.web .
      - run: kubectl kustomize infra/k8s/overlays/prod
