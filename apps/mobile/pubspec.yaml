name: krompay
description: KromPay employee mobile — GPS, face attendance, ESS
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  geolocator: ^13.0.2
  camera: ^0.11.1
  firebase_messaging: ^15.2.4
  intl: ^0.19.0
  go_router: ^14.8.1
  provider: ^6.1.2
  path_provider: ^2.1.5
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
